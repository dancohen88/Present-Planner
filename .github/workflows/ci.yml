# Runs on every pull request: everything that can break, checked before merge.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail if anything that ships to users has a known vulnerability.
      # Build and test tools are left out: they never run on a phone, and
      # one of them has an advisory with no fix released yet (see README).
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      # The build type-checks (tsc -b) before bundling.
      - run: npm run build
      - run: npm test

  integration:
    name: Database and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A throwaway local Supabase in Docker, without the services the tests
      # don't use, to save a minute or two of image downloads.
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: npm run db:env
      - run: npm run test:db
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run test:e2e
      # If anything failed, show what the database services were doing.
      - name: Supabase logs (on failure)
        if: failure()
        run: |
          for service in realtime auth db; do
            echo "::group::$service"
            docker logs "supabase_${service}_Present_Planner" --tail 150 2>&1 || true
            echo "::endgroup::"
          done
