<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the installed app use the whole screen on
         phones with a notch; the CSS keeps content clear of it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Plan gifts with your family: ideas, budgets and who is buying what."
    />
    <meta
      name="theme-color"
      content="#f7f2ea"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#14161a"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-title" content="Presents" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Present Planner</title>
    <!-- Set the saved skin before the first paint. The app's own code loads
         later, so without this the page would flash the Classic colours
         first (a "flash of unstyled content"). The key matches storage.ts;
         an unknown value matches no skin's CSS and shows Classic. -->
    <script>
      try {
        var skin = localStorage.getItem('present-planner/skin')
        if (skin && skin !== 'classic')
          document.documentElement.dataset.skin = skin
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
