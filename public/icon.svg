  <!-- Bow -->
  <g fill="none" stroke="#7cc7a0" stroke-width="22" stroke-linecap="round">
    <path d="M256 178 C 222 120, 160 128, 172 166 C 182 196, 232 186, 256 178 Z"/>
    <path d="M256 178 C 290 120, 352 128, 340 166 C 330 196, 280 186, 256 178 Z"/>
  </g>
  <!-- Lid and box -->
  <rect x="130" y="186" width="252" height="64" rx="14" fill="#ffffff"/>
  <rect x="148" y="246" width="216" height="150" rx="14" fill="#f7f2ea"/>
  <!-- Ribbon -->
  <rect x="236" y="186" width="40" height="210" fill="#2f6f4f"/>
</svg>
