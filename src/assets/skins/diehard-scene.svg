<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2338"/>
      <stop offset="0.7" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <radialGradient id="fire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.3" stop-color="#ffc44d"/>
      <stop offset="0.65" stop-color="#f2702a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c0361b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f29d38" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f29d38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#dfe8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090c12" stop-opacity="0"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <pattern id="windows" width="14" height="12" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="8" height="6" fill="#2a3346"/>
    </pattern>
    <pattern id="windows-far" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="5" height="5" fill="#1d2433"/>
    </pattern>
  </defs>

  <rect width="1600" height="220" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#dfe8ff" opacity="0.7">
    <circle cx="60" cy="20" r="1.2"/><circle cx="210" cy="44" r="1"/><circle cx="330" cy="14" r="1.4"/>
    <circle cx="480" cy="36" r="1"/><circle cx="640" cy="18" r="1.2"/><circle cx="1010" cy="24" r="1"/>
    <circle cx="1150" cy="12" r="1.4"/><circle cx="1290" cy="40" r="1"/><circle cx="1420" cy="20" r="1.2"/>
    <circle cx="1550" cy="46" r="1"/>
  </g>

  <!-- Searchlight from the helicopter, sweeping the tower -->
  <path d="M520 46 L760 220 L860 220 Z" fill="url(#beam)"/>

  <!-- Far skyline -->
  <g fill="#121827">
    <rect x="0" y="120" width="90" height="100"/><rect x="95" y="100" width="70" height="120"/>
    <rect x="170" y="130" width="110" height="90"/><rect x="290" y="90" width="60" height="130"/>
    <rect x="1060" y="110" width="80" height="110"/><rect x="1150" y="80" width="64" height="140"/>
    <rect x="1220" y="125" width="120" height="95"/><rect x="1350" y="96" width="70" height="124"/>
    <rect x="1430" y="130" width="90" height="90"/><rect x="1525" y="105" width="75" height="115"/>
  </g>
  <g fill="url(#windows-far)">
    <rect x="95" y="100" width="70" height="120"/><rect x="290" y="90" width="60" height="130"/>
    <rect x="1150" y="80" width="64" height="140"/><rect x="1350" y="96" width="70" height="124"/>
  </g>

  <!-- Glow of the fire on the sky -->
  <ellipse cx="860" cy="48" rx="200" ry="90" fill="url(#haze)"/>

  <!-- The tower -->
  <path d="M720 30 L790 14 L860 30 V220 H720 Z" fill="#1a2132"/>
  <path d="M790 14 L860 30 V220 H790 Z" fill="#141a28"/>
  <rect x="720" y="34" width="140" height="186" fill="url(#windows)"/>
  <!-- Lit offices: someone's working late on Christmas Eve -->
  <g fill="#e8d9a8" opacity="0.8">
    <rect x="737" y="135" width="8" height="6"/><rect x="751" y="135" width="8" height="6"/>
    <rect x="793" y="159" width="8" height="6"/><rect x="765" y="183" width="8" height="6"/>
    <rect x="821" y="111" width="8" height="6"/><rect x="723" y="171" width="8" height="6"/>
  </g>
  <!-- One floor blown out, burning -->
  <rect x="790" y="48" width="70" height="20" fill="#f29d38"/>
  <rect x="720" y="48" width="70" height="20" fill="#c9701f"/>
  <ellipse cx="872" cy="56" rx="78" ry="46" fill="url(#fire)"/>
  <ellipse cx="900" cy="44" rx="40" ry="26" fill="url(#fire)"/>
  <!-- Smoke -->
  <path d="M860 36 q30 -30 70 -20 q40 -16 60 8 q30 -6 40 14 q-40 -4 -70 -10 q-40 8 -100 8 Z" fill="#2a2f3a" opacity="0.8"/>
  <!-- Glass and debris -->
  <g fill="#dfe8ff" opacity="0.8">
    <path d="M940 70 l6 -3 l-2 6 Z"/><path d="M968 52 l5 2 l-4 3 Z"/><path d="M925 92 l4 -4 l1 6 Z"/>
    <path d="M985 80 l6 1 l-4 4 Z"/><path d="M955 104 l4 -2 l-1 5 Z"/><path d="M1005 60 l5 -1 l-2 5 Z"/>
  </g>
  <g fill="#ffc44d">
    <circle cx="950" cy="62" r="1.8"/><circle cx="978" cy="90" r="1.5"/><circle cx="1012" cy="74" r="1.8"/>
    <circle cx="930" cy="110" r="1.3"/>
  </g>
  <!-- Rooftop mast with a red light -->
  <rect x="788" y="0" width="4" height="16" fill="#1a2132"/>
  <circle cx="790" cy="2" r="2.5" fill="#ff4d4d"/>

  <!-- Near buildings -->
  <g fill="#0d121c">
    <rect x="360" y="140" width="140" height="80"/><rect x="510" y="120" width="90" height="100"/>
    <rect x="610" y="150" width="100" height="70"/><rect x="870" y="140" width="90" height="80"/>
    <rect x="965" y="118" width="80" height="102"/>
  </g>
  <!-- Christmas lights strung along a rooftop -->
  <path d="M360 140 Q395 152 430 140 Q465 152 500 140" fill="none" stroke="#2a3346" stroke-width="1"/>
  <g>
    <circle cx="372" cy="145" r="2.4" fill="#ff4d4d"/><circle cx="386" cy="148" r="2.4" fill="#4ddb7a"/>
    <circle cx="400" cy="148" r="2.4" fill="#ffc44d"/><circle cx="414" cy="146" r="2.4" fill="#4d9bff"/>
    <circle cx="442" cy="145" r="2.4" fill="#ff4d4d"/><circle cx="456" cy="148" r="2.4" fill="#4ddb7a"/>
    <circle cx="470" cy="148" r="2.4" fill="#ffc44d"/><circle cx="484" cy="146" r="2.4" fill="#4d9bff"/>
  </g>
  <!-- A small tree in a lit window -->
  <rect x="975" y="150" width="22" height="18" fill="#3a2a14"/>
  <path d="M986 152 l7 13 h-14 Z" fill="#2f6b3a"/>
  <circle cx="986" cy="152" r="1.5" fill="#ffc44d"/>

  <!-- Helicopter -->
  <g transform="translate(510 44) rotate(-6)" fill="#05070b">
    <ellipse cx="0" cy="0" rx="22" ry="9"/>
    <path d="M18 -2 L58 -5 L58 1 L18 5 Z"/>
    <path d="M54 -12 L60 -12 L60 2 L54 2 Z"/>
    <rect x="-36" y="-14" width="72" height="2.5" rx="1"/>
    <rect x="-1.5" y="-12" width="3" height="5"/>
    <path d="M-16 10 H14 M-10 8 V11 M8 8 V11" stroke="#05070b" stroke-width="2"/>
    <circle cx="-14" cy="-1" r="3.5" fill="#dfe8ff" opacity="0.8"/>
  </g>

  <!-- Fade the street into the page -->
  <rect x="0" y="150" width="1600" height="70" fill="url(#ground)"/>
</svg>
