<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d2e8"/>
      <stop offset="0.75" stop-color="#e2edf7"/>
      <stop offset="1" stop-color="#e9f1f8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <!-- One snowy pine, reused at different sizes. -->
    <g id="pine">
      <path d="M0 -70 L22 -30 L12 -30 L30 0 L-30 0 L-12 -30 L-22 -30 Z" fill="#4d7489"/>
      <path d="M0 -70 L10 -52 Q0 -46 -10 -52 Z M-14 -32 Q0 -26 14 -32 L18 -26 Q0 -20 -18 -26 Z M-24 -6 Q0 2 24 -6 L30 0 L-30 0 Z" fill="#ffffff"/>
      <rect x="-3" y="0" width="6" height="8" fill="#6b5446"/>
    </g>
    <g id="flake" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round">
      <path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3"/>
    </g>
  </defs>

  <rect width="1600" height="220" fill="url(#sky)"/>

  <!-- Far hills, then near hills: paler means further away. -->
  <path d="M0 150 Q160 100 340 135 T700 120 T1060 130 T1400 110 T1600 130 V220 H0 Z" fill="#d4e3f1"/>
  <path d="M0 175 Q220 140 460 165 T900 158 T1300 168 T1600 155 V220 H0 Z" fill="#e1ecf6"/>

  <!-- Far trees -->
  <g opacity="0.55">
    <use href="#pine" transform="translate(120 150) scale(0.55)"/>
    <use href="#pine" transform="translate(150 155) scale(0.45)"/>
    <use href="#pine" transform="translate(420 142) scale(0.5)"/>
    <use href="#pine" transform="translate(1180 140) scale(0.55)"/>
    <use href="#pine" transform="translate(1215 146) scale(0.42)"/>
    <use href="#pine" transform="translate(1480 132) scale(0.5)"/>
  </g>

  <!-- Cottage, a little right of centre -->
  <g transform="translate(960 172)">
    <ellipse cx="0" cy="-20" rx="90" ry="50" fill="url(#glow)"/>
    <rect x="18" y="-78" width="12" height="26" fill="#7a5040"/>
    <rect x="15" y="-82" width="18" height="6" rx="3" fill="#ffffff"/>
    <path d="M26 -86 q-10 -12 2 -22 q12 -10 0 -24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <rect x="-44" y="-40" width="88" height="42" fill="#9a5b46"/>
    <path d="M-56 -38 L0 -76 L56 -38 Z" fill="#6b3d33"/>
    <path d="M-60 -36 L0 -80 L60 -36 Q56 -30 50 -34 Q40 -28 30 -34 Q18 -26 4 -34 Q-10 -27 -22 -34 Q-36 -27 -46 -34 Q-54 -30 -60 -36 Z" fill="#ffffff"/>
    <rect x="-32" y="-28" width="18" height="16" rx="2" fill="#ffd27a"/>
    <rect x="14" y="-28" width="18" height="16" rx="2" fill="#ffd27a"/>
    <path d="M-23 -28 V-12 M-32 -20 H-14 M23 -28 V-12 M14 -20 H32" stroke="#9a5b46" stroke-width="2"/>
    <rect x="-8" y="-24" width="16" height="26" rx="2" fill="#5b3a2e"/>
    <circle cx="0" cy="-30" r="6" fill="none" stroke="#2f6b3a" stroke-width="3"/>
    <circle cx="0" cy="-36" r="1.8" fill="#c0392b"/>
  </g>

  <!-- Near trees -->
  <use href="#pine" transform="translate(60 196) scale(1.1)"/>
  <use href="#pine" transform="translate(240 190) scale(0.85)"/>
  <use href="#pine" transform="translate(300 198) scale(1.25)"/>
  <use href="#pine" transform="translate(830 188) scale(0.8)"/>
  <use href="#pine" transform="translate(1100 190) scale(0.95)"/>
  <use href="#pine" transform="translate(1360 196) scale(1.2)"/>
  <use href="#pine" transform="translate(1430 190) scale(0.8)"/>
  <use href="#pine" transform="translate(1560 198) scale(1.05)"/>

  <!-- Snowman -->
  <g transform="translate(620 186)">
    <circle cx="0" cy="0" r="20" fill="#ffffff"/>
    <circle cx="0" cy="-30" r="14" fill="#ffffff"/>
    <rect x="-11" y="-50" width="22" height="5" fill="#2a3440"/>
    <rect x="-7" y="-64" width="14" height="15" fill="#2a3440"/>
    <path d="M-13 -20 Q0 -14 13 -20 L11 -15 Q0 -10 -11 -15 Z" fill="#c0392b"/>
    <path d="M6 -16 l4 14 l-6 -1 Z" fill="#c0392b"/>
    <circle cx="-5" cy="-34" r="1.6" fill="#2a3440"/>
    <circle cx="5" cy="-34" r="1.6" fill="#2a3440"/>
    <path d="M0 -30 l9 2 l-9 2 Z" fill="#e67e22"/>
    <path d="M-14 -6 L-34 -22 M18 -8 L34 -24" stroke="#6b5446" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Falling snow -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="2.5"/><circle cx="110" cy="80" r="2"/><circle cx="190" cy="20" r="3"/>
    <circle cx="260" cy="60" r="2"/><circle cx="350" cy="35" r="2.5"/><circle cx="400" cy="95" r="2"/>
    <circle cx="480" cy="18" r="2"/><circle cx="540" cy="70" r="3"/><circle cx="600" cy="40" r="2"/>
    <circle cx="690" cy="88" r="2.5"/><circle cx="760" cy="26" r="2"/><circle cx="820" cy="64" r="3"/>
    <circle cx="880" cy="22" r="2"/><circle cx="1010" cy="40" r="2.5"/><circle cx="1070" cy="90" r="2"/>
    <circle cx="1140" cy="30" r="3"/><circle cx="1230" cy="75" r="2"/><circle cx="1290" cy="20" r="2.5"/>
    <circle cx="1340" cy="60" r="2"/><circle cx="1420" cy="35" r="3"/><circle cx="1500" cy="80" r="2"/>
    <circle cx="1560" cy="25" r="2.5"/>
  </g>
  <use href="#flake" transform="translate(150 50)"/>
  <use href="#flake" transform="translate(450 60) scale(1.3)"/>
  <use href="#flake" transform="translate(720 50)"/>
  <use href="#flake" transform="translate(1190 55) scale(1.2)"/>
  <use href="#flake" transform="translate(1460 60)"/>
</svg>
