<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b98a"/>
      <stop offset="0.8" stop-color="#ead3ad"/>
      <stop offset="1" stop-color="#f1e2c8"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffe3a0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe3a0" stop-opacity="0"/>
    </radialGradient>
    <g id="present">
      <rect x="-16" y="-28" width="32" height="28" rx="2"/>
      <rect x="-3" y="-28" width="6" height="28" fill="#f3d36b"/>
      <path d="M0 -28 q-12 -12 -14 -2 q2 6 14 2 q12 4 14 -2 q-2 -10 -14 2" fill="#f3d36b"/>
    </g>
  </defs>

  <rect width="1600" height="220" fill="url(#wall)"/>
  <!-- Plank seams -->
  <g stroke="#c9a674" stroke-width="2" opacity="0.6">
    <path d="M80 0 V160 M200 0 V160 M330 0 V160 M450 0 V160 M580 0 V160 M700 0 V160 M830 0 V160 M950 0 V160 M1080 0 V160 M1200 0 V160 M1330 0 V160 M1450 0 V160 M1570 0 V160"/>
  </g>
  <g fill="#b89060" opacity="0.5">
    <circle cx="140" cy="40" r="3"/><circle cx="520" cy="90" r="2.5"/><circle cx="890" cy="30" r="3"/><circle cx="1260" cy="110" r="2.5"/><circle cx="1510" cy="50" r="3"/>
  </g>

  <!-- Lamp glow behind everything else -->
  <ellipse cx="420" cy="80" rx="150" ry="90" fill="url(#lamp)"/>
  <ellipse cx="1180" cy="80" rx="150" ry="90" fill="url(#lamp)"/>

  <!-- Bunting: two swags of flags -->
  <path d="M-20 6 Q400 70 800 8 Q1200 70 1620 6" fill="none" stroke="#6b4a2b" stroke-width="2.5"/>
  <g stroke="#6b4a2b" stroke-width="1">
    <path d="M40 15 l26 4 l-17 26 Z" fill="#b23a2e"/>
    <path d="M110 25 l26 3 l-15 27 Z" fill="#2f6b3a"/>
    <path d="M180 33 l26 2 l-14 28 Z" fill="#fff6e4"/>
    <path d="M250 39 l26 1 l-13 28 Z" fill="#d9a441"/>
    <path d="M320 42 l26 0 l-13 28 Z" fill="#b23a2e"/>
    <path d="M390 43 l26 0 l-13 28 Z" fill="#2f6b3a"/>
    <path d="M460 42 l26 -1 l-12 28 Z" fill="#fff6e4"/>
    <path d="M530 38 l26 -2 l-12 28 Z" fill="#d9a441"/>
    <path d="M600 32 l26 -3 l-11 28 Z" fill="#b23a2e"/>
    <path d="M670 23 l26 -4 l-10 27 Z" fill="#2f6b3a"/>
    <path d="M740 14 l26 -4 l-9 27 Z" fill="#fff6e4"/>
    <path d="M840 14 l26 4 l-17 26 Z" fill="#d9a441"/>
    <path d="M910 23 l26 4 l-16 27 Z" fill="#b23a2e"/>
    <path d="M980 32 l26 3 l-15 27 Z" fill="#2f6b3a"/>
    <path d="M1050 38 l26 2 l-14 28 Z" fill="#fff6e4"/>
    <path d="M1120 42 l26 1 l-13 28 Z" fill="#d9a441"/>
    <path d="M1190 43 l26 0 l-13 28 Z" fill="#b23a2e"/>
    <path d="M1260 42 l26 -1 l-12 28 Z" fill="#2f6b3a"/>
    <path d="M1330 39 l26 -2 l-12 28 Z" fill="#fff6e4"/>
    <path d="M1400 33 l26 -3 l-11 28 Z" fill="#d9a441"/>
    <path d="M1470 25 l26 -4 l-10 27 Z" fill="#b23a2e"/>
    <path d="M1540 15 l26 -4 l-9 27 Z" fill="#2f6b3a"/>
  </g>

  <!-- Pendant lamps -->
  <g fill="#3b4a3a">
    <path d="M420 0 V58" stroke="#3b4a3a" stroke-width="2"/>
    <path d="M396 76 Q420 50 444 76 Z"/>
    <path d="M1180 0 V58" stroke="#3b4a3a" stroke-width="2"/>
    <path d="M1156 76 Q1180 50 1204 76 Z"/>
  </g>
  <ellipse cx="420" cy="77" rx="9" ry="4" fill="#ffe3a0"/>
  <ellipse cx="1180" cy="77" rx="9" ry="4" fill="#ffe3a0"/>

  <!-- Shelf with toys -->
  <rect x="0" y="160" width="1600" height="12" fill="#8a5a32"/>
  <rect x="0" y="172" width="1600" height="5" fill="#6b4426"/>

  <!-- Alphabet blocks -->
  <g font-family="Georgia, serif" font-weight="700" font-size="20" text-anchor="middle">
    <rect x="60" y="126" width="34" height="34" rx="3" fill="#b23a2e"/><text x="77" y="150" fill="#fff6e4">A</text>
    <rect x="96" y="126" width="34" height="34" rx="3" fill="#2f6b3a"/><text x="113" y="150" fill="#fff6e4">B</text>
    <rect x="78" y="92" width="34" height="34" rx="3" fill="#d9a441"/><text x="95" y="116" fill="#4a2f17">C</text>
  </g>

  <!-- Presents -->
  <use href="#present" transform="translate(250 160)" fill="#b23a2e"/>
  <use href="#present" transform="translate(290 160) scale(0.8)" fill="#2f6b3a"/>
  <use href="#present" transform="translate(268 132) scale(0.65)" fill="#fff6e4"/>

  <!-- Toy train -->
  <g transform="translate(520 160)">
    <rect x="0" y="-34" width="44" height="26" rx="3" fill="#b23a2e"/>
    <rect x="28" y="-52" width="18" height="20" fill="#b23a2e"/>
    <rect x="24" y="-56" width="26" height="6" rx="2" fill="#4a2f17"/>
    <rect x="6" y="-48" width="9" height="16" fill="#4a2f17"/>
    <rect x="3" y="-52" width="15" height="5" rx="2" fill="#4a2f17"/>
    <rect x="31" y="-48" width="11" height="9" fill="#ffe3a0"/>
    <rect x="-56" y="-28" width="48" height="20" rx="3" fill="#2f6b3a"/>
    <rect x="-112" y="-28" width="48" height="20" rx="3" fill="#d9a441"/>
    <path d="M-8 -18 H0 M-64 -18 H-56" stroke="#4a2f17" stroke-width="3"/>
    <g fill="#4a2f17">
      <circle cx="10" cy="-6" r="7"/><circle cx="34" cy="-6" r="7"/>
      <circle cx="-44" cy="-6" r="6"/><circle cx="-20" cy="-6" r="6"/>
      <circle cx="-100" cy="-6" r="6"/><circle cx="-76" cy="-6" r="6"/>
    </g>
    <g fill="#d9a441"><circle cx="10" cy="-6" r="2"/><circle cx="34" cy="-6" r="2"/></g>
  </g>

  <!-- Spinning top -->
  <g transform="translate(700 160)">
    <path d="M0 0 L-24 -26 Q0 -44 24 -26 Z" fill="#2f6b3a"/>
    <path d="M-24 -26 Q0 -14 24 -26" fill="none" stroke="#fff6e4" stroke-width="3"/>
    <rect x="-3" y="-54" width="6" height="14" fill="#4a2f17"/>
  </g>

  <!-- Nutcracker-style toy soldier -->
  <g transform="translate(900 160)">
    <rect x="-9" y="-22" width="7" height="22" fill="#1e2a44"/>
    <rect x="2" y="-22" width="7" height="22" fill="#1e2a44"/>
    <rect x="-12" y="-52" width="24" height="32" rx="3" fill="#b23a2e"/>
    <path d="M-12 -40 H12" stroke="#f3d36b" stroke-width="3"/>
    <circle cx="0" cy="-62" r="10" fill="#f2c9a0"/>
    <rect x="-11" y="-92" width="22" height="26" rx="4" fill="#1e2a44"/>
    <rect x="-12" y="-70" width="24" height="4" fill="#f3d36b"/>
    <circle cx="-4" cy="-62" r="1.5" fill="#1e2a44"/><circle cx="4" cy="-62" r="1.5" fill="#1e2a44"/>
  </g>

  <!-- Teddy bear -->
  <g transform="translate(1070 160)" fill="#a8743f">
    <ellipse cx="0" cy="-20" rx="22" ry="20"/>
    <circle cx="0" cy="-54" r="17"/>
    <circle cx="-14" cy="-68" r="7"/><circle cx="14" cy="-68" r="7"/>
    <ellipse cx="-20" cy="-4" rx="9" ry="7"/><ellipse cx="20" cy="-4" rx="9" ry="7"/>
    <ellipse cx="0" cy="-48" rx="8" ry="6" fill="#d8b07a"/>
    <circle cx="-6" cy="-58" r="2" fill="#3a2414"/><circle cx="6" cy="-58" r="2" fill="#3a2414"/>
    <circle cx="0" cy="-50" r="2.4" fill="#3a2414"/>
    <path d="M-12 -38 L12 -38 L4 -32 L0 -36 L-4 -32 Z" fill="#b23a2e"/>
  </g>

  <!-- More presents and blocks on the right -->
  <use href="#present" transform="translate(1290 160) scale(1.1)" fill="#d9a441"/>
  <use href="#present" transform="translate(1330 160) scale(0.75)" fill="#b23a2e"/>
  <g font-family="Georgia, serif" font-weight="700" font-size="20" text-anchor="middle">
    <rect x="1500" y="126" width="34" height="34" rx="3" fill="#2f6b3a"/><text x="1517" y="150" fill="#fff6e4">X</text>
    <rect x="1536" y="126" width="34" height="34" rx="3" fill="#b23a2e"/><text x="1553" y="150" fill="#fff6e4">O</text>
  </g>

  <!-- Wood-shavings strip fading into the page -->
  <rect x="0" y="177" width="1600" height="43" fill="#f1e2c8" opacity="0.55"/>
</svg>
